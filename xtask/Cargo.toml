[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["std", "clock", "serde"] }
hex = "0.4"
libc = "0.2"
object = { version = "0.37.3", default-features = false, features = ["read"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shinki-emu-build = { path = "../Source/Tools/shinki-emu-build" }
shinki-emu-metadata = { path = "../Source/Providers/shinki-emu-metadata" }
tempfile = "3"
toml = "0.8"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
