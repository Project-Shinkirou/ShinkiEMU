[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cc = "1.10.0"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", features = ["std", "clock", "serde"] }
dunce = "1.0.5"
flate2 = "1.1.10"
hex = "0.4.3"
libc = "0.2.191"
object = { version = "0.40.0", default-features = false, features = ["read"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
resvg = "0.48.1"
spdx = { version = "=0.13.6", features = ["std", "text"] }
shinki-emu-build = { path = "../Source/Tools/shinki-emu-build" }
shinki-emu-metadata = { path = "../Source/Providers/shinki-emu-metadata" }
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.1.8"
walkdir = "2.5.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
