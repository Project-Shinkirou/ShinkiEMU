name: Component release
on:
  push:
    tags: ['manager-v*', 'core-*-v*']
  workflow_dispatch:
    inputs:
      component:
        description: 'manager or exact plugin_id (case-sensitive)'
        required: true
        default: manager
      version:
        description: Semver version
        required: true
        default: 0.1.0-beta.1
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.component }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      component: ${{ steps.select.outputs.component }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
      - run: rustup show
      - id: select
        shell: pwsh
        env:
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $matrix = cargo xtask matrix --json | ConvertFrom-Json
          $component = $env:INPUT_COMPONENT
          $version = $env:INPUT_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -match '^manager-v(.+)$') {
              $component = 'manager'; $version = $Matches[1]
            } else {
              $candidates = @($matrix.include.component | Sort-Object -Unique | Where-Object { $_ -ne 'manager' })
              $matched = @($candidates | Where-Object {
                $slug = $_.ToLowerInvariant().Replace('.', '-').Replace('_', '-')
                $env:GITHUB_REF_NAME.StartsWith("core-$slug-v")
              })
              if ($matched.Count -ne 1) { throw 'Tag does not identify one core' }
              $component = $matched[0]
              $slug = $component.ToLowerInvariant().Replace('.', '-').Replace('_', '-')
              $version = $env:GITHUB_REF_NAME.Substring("core-$slug-v".Length)
            }
          }
          $rows = @($matrix.include | Where-Object { $_.component -ceq $component })
          if ($rows.Count -eq 0) { throw 'Unknown or empty component matrix' }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Invalid semantic version' }
          "matrix=$(@{include=$rows} | ConvertTo-Json -Compress -Depth 8)" >> $env:GITHUB_OUTPUT
          "component=$component" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
  build:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      SHINKI_EMU_CI_VERSION: ${{ needs.select.outputs.version }}
      OHOS_SDK_NATIVE: ${{ vars.OHOS_SDK_NATIVE }}
      ROUKAKU_SUBTITLE_VCPKG_ROOT: ${{ github.workspace }}/.work/vcpkg-subtitle
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
      - run: rustup show
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
        if: matrix.status == 'supported'
        with:
          version: '3.02'
      - name: Linux desktop prerequisites
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.status == 'supported'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config nasm patchelf autoconf automake libtool bison flex gperf libssl-dev libasound2-dev libudev-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers xvfb xauth unzip jq
          sudo apt-get install -y --no-install-recommends autoconf-archive libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - uses: actions/setup-java@v6
        if: contains(matrix.target, 'android') && matrix.status == 'supported'
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Android native build prerequisites
        if: contains(matrix.target, 'android') && matrix.status == 'supported'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config
      - name: Android SDK
        if: contains(matrix.target, 'android') && matrix.status == 'supported'
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Prepare supported build
        if: matrix.status == 'supported'
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup target add $env:TARGET
          if ($env:COMPONENT -eq 'manager') {
            cargo xtask deps --target $env:TARGET
            if ($env:TARGET.Contains('android')) {
              $other = if ($env:TARGET -eq 'aarch64-linux-android') { 'x86_64-linux-android' } else { 'aarch64-linux-android' }
              rustup target add $other
              cargo xtask deps --target $other
            }
          }
          else { cargo xtask deps --target $env:TARGET --core $env:COMPONENT }
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
          SHINKI_EMU_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHINKI_EMU_ANDROID_KEYSTORE_BASE64 }}
          SHINKI_EMU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHINKI_EMU_ANDROID_KEYSTORE_PASSWORD }}
          SHINKI_EMU_ANDROID_KEY_ALIAS: ${{ secrets.SHINKI_EMU_ANDROID_KEY_ALIAS }}
          SHINKI_EMU_ANDROID_KEY_PASSWORD: ${{ secrets.SHINKI_EMU_ANDROID_KEY_PASSWORD }}
          SHINKI_EMU_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: cargo xtask ci --target $env:TARGET --component $env:COMPONENT --report .work/ci-report.json
      - name: Smoke packaged Linux Manager
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.component == 'manager' && matrix.status == 'supported'
        shell: bash
        run: |
          bash build/ci/linux-manager-smoke.sh "$(jq -er '.artifact' .work/ci-report.json)"
      - name: Prepare Release files without publishing
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ needs.select.outputs.version }}
          SHINKI_EMU_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHINKI_EMU_ANDROID_KEYSTORE_BASE64 }}
          SHINKI_EMU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHINKI_EMU_ANDROID_KEYSTORE_PASSWORD }}
          SHINKI_EMU_ANDROID_KEY_ALIAS: ${{ secrets.SHINKI_EMU_ANDROID_KEY_ALIAS }}
          SHINKI_EMU_ANDROID_KEY_PASSWORD: ${{ secrets.SHINKI_EMU_ANDROID_KEY_PASSWORD }}
          SHINKI_EMU_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $report = Get-Content -Raw .work/ci-report.json | ConvertFrom-Json
          if ($null -ne $report.artifact) {
            cargo xtask release --component $env:COMPONENT --target $env:TARGET --version $env:VERSION
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-report-${{ matrix.target }}
          path: .work/ci-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.status == 'supported'
        with:
          name: release-files-${{ matrix.target }}
          path: .work/release/
          include-hidden-files: true
          if-no-files-found: ignore
  publish:
    if: github.ref_type == 'tag'
    needs: [select, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
      - run: rustup show
      - uses: actions/download-artifact@v8
        with:
          pattern: release-files-*
          path: .work/release/
          merge-multiple: true
      - name: Publish only actual successfully aggregated platforms
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.select.outputs.component }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $matrix = cargo xtask matrix --json | ConvertFrom-Json
          $published = 0
          foreach ($row in $matrix.include | Where-Object { $_.component -ceq $env:COMPONENT -and $_.status -eq 'supported' }) {
            $slug = $env:COMPONENT.ToLowerInvariant().Replace('.', '-').Replace('_', '-')
            $tag = if ($env:COMPONENT -eq 'manager') { "manager-v$env:VERSION" } else { "core-$slug-v$env:VERSION" }
            if (Test-Path ".work/release/$tag/$($row.target)/package") {
              cargo xtask release --component $env:COMPONENT --target $row.target --version $env:VERSION --publish
              $published++
            }
          }
          if ($published -eq 0) { throw 'No publishable artifact; no Release created' }
