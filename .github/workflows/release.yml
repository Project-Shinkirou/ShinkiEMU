name: Component release
# Manually prepare selected components. Publication uses reviewed artifacts locally.
on:
  workflow_dispatch:
    inputs:
      version:
        description: One product SemVer for Manager and all selected self-owned cores; external cores use their own pinned identities
        required: false
      components:
        description: 'Comma-separated manager/plugin_ids (case-sensitive), or all supported components'
        required: true
      source_commit:
        description: 'Optional exact lowercase 40-hex product SHA; omit to use the workflow commit'
        type: string
        required: false
      release_scope:
        description: 'Platforms covered by this release'
        type: choice
        options: [all, windows-android]
        default: all
      upload_packages:
        description: Confirm redistribution rights for all uploaded packages when preparing on the public repository
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  RELEASE_SCOPE: ${{ inputs.release_scope || 'all' }}
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      components: ${{ steps.select.outputs.components }}
      local_manager: ${{ steps.select.outputs.local_manager }}
      source_commit: ${{ steps.select.outputs.source_commit }}
    steps:
      - name: Require permission to upload binaries on the public repository
        if: github.event.repository.private != true && inputs.upload_packages != true
        run: |
          echo "::error::Workflow artifacts are downloadable by readers of the public repository. Use local preparation or confirm redistribution rights with upload_packages=true."
          exit 1
      # The inventory needs the cpal submodule for workspace resolution, not LFS payloads.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          submodules: true
      - run: rustup show
      - id: select
        shell: pwsh
        env:
          INPUT_COMPONENTS: ${{ inputs.components }}
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:EXPECTED_SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'source_commit must be an exact lowercase 40-hex product SHA' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checked-out product SHA differs from the selected source_commit' }
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT
          "Workflow dispatch SHA: $env:GITHUB_SHA; actual product/source SHA: $sourceCommit; scope=$env:RELEASE_SCOPE" >> $env:GITHUB_STEP_SUMMARY
          $localManager = $false
          $matrixArguments = @('xtask', 'matrix', '--json', '--ci')
          if ($env:RELEASE_SCOPE -ne 'all') {
            $matrixArguments += @('--scope', $env:RELEASE_SCOPE)
          }
          $rows = @((cargo @matrixArguments | ConvertFrom-Json).include)
          $known = @($rows.component | Sort-Object -Unique -CaseSensitive)
          $version = $env:INPUT_VERSION.Trim()
          if ($env:INPUT_COMPONENTS.Trim() -ceq 'all') {
            $requested = $known
          } else {
            $requested = @($env:INPUT_COMPONENTS.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Sort-Object -Unique -CaseSensitive)
          }
          if ($requested.Count -eq 0) { throw 'No components selected' }
          $versions = @{}
          $components = @()
          foreach ($component in $requested) {
            $own = @($rows | Where-Object { $_.component -ceq $component })
            if ($own.Count -eq 0) { throw "Unknown component '$component', or it has no supported target" }
            $arguments = @('xtask', 'release', '--component', $component, '--dry-run')
            if ($env:RELEASE_SCOPE -ne 'all') { $arguments += @('--scope', $env:RELEASE_SCOPE) }
            if (-not $own[0].external) { $arguments += @('--version', $version) }
            $identity = cargo @arguments | ConvertFrom-Json
            $localManager = $localManager -or $identity.local_manager
            $versions[$component] = $identity.version
            $components += @{component=$component; version=$identity.version; external=$own[0].external; tag=$identity.release_tag}
          }
          $include = @($rows | Where-Object { $_.component -cin $requested } | ForEach-Object {
            $_ | Add-Member -NotePropertyName version -NotePropertyValue $versions[$_.component] -PassThru
          })
          "matrix=$(@{include=$include} | ConvertTo-Json -Compress -Depth 8)" >> $env:GITHUB_OUTPUT
          "components=$(@{include=$components} | ConvertTo-Json -Compress -Depth 8)" >> $env:GITHUB_OUTPUT
          "local_manager=$($localManager.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "Per-component release identities: $($components | ConvertTo-Json -Compress)" >> $env:GITHUB_STEP_SUMMARY
  build:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      VERSION: ${{ matrix.version }}
      SHINKI_EMU_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHINKI_EMU_ANDROID_KEYSTORE_BASE64 }}
      SHINKI_EMU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHINKI_EMU_ANDROID_KEYSTORE_PASSWORD }}
      SHINKI_EMU_ANDROID_KEY_ALIAS: ${{ secrets.SHINKI_EMU_ANDROID_KEY_ALIAS }}
      SHINKI_EMU_ANDROID_KEY_PASSWORD: ${{ secrets.SHINKI_EMU_ANDROID_KEY_PASSWORD }}
      SHINKI_EMU_ANDROID_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.source_commit }}
          submodules: true
          lfs: true
      - uses: actions/cache@v5
        with:
          path: .work/vcpkg-binary-cache
          key: vcpkg-${{ matrix.target }}-${{ matrix.component }}-${{ hashFiles('build/dependencies.toml', 'build/vcpkg/**', 'Cargo.lock') }}
      - run: rustup show
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
        if: runner.os != 'Linux'
        with:
          version: '3.02'
      - name: Apple native prerequisites
        if: runner.os == 'macOS' && (matrix.component == 'kirikiroid2-web' || (matrix.component == 'manager' && matrix.platform == 'ios'))
        shell: bash
        run: |
          brew install bison yasm
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          rustup component add llvm-tools-preview
      - name: KiriKiri desktop prerequisites
        if: runner.os == 'macOS' && matrix.component == 'kirikiroid2-web'
        shell: bash
        run: |
          brew install autoconf automake autoconf-archive libtool gperf
          echo "$(brew --prefix gperf)/bin" >> "$GITHUB_PATH"
      - name: Linux desktop prerequisites
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config nasm yasm patchelf autoconf automake libtool libltdl-dev autoconf-archive python3-jinja2 python3-venv libxtst-dev libxxf86vm-dev libxinerama-dev bison flex gperf libssl-dev libasound2-dev libudev-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers xvfb xauth unzip jq
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-java@v6
        if: contains(matrix.target, 'android')
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Android native build prerequisites
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm yasm pkg-config build-essential cmake ninja-build ccache clang-18 llvm-18 lld-18 autoconf autoconf-archive automake libtool-bin python3-jinja2 patch unzip zip bc libssl-dev libbz2-dev liblzma-dev libavcodec-dev libavformat-dev libswresample-dev libswscale-dev libfreetype6-dev libfribidi-dev libsdl2-dev libsdl2-image-dev libsdl2-gfx-dev libsdl2-mixer-dev libsdl2-ttf-dev libjpeg-dev libharfbuzz-dev libassimp-dev bison flex
      - name: Android SDK
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        if: matrix.platform == 'android'
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add $env:TARGET
      - name: Install the second ABI for the universal Android Manager
        if: matrix.target == 'aarch64-linux-android' && matrix.component == 'manager'
        run: rustup target add x86_64-linux-android
      - run: cargo install cargo-about --version 0.9.3 --locked --features cli --bin cargo-about
      - name: Prepare release files
        if: matrix.component != 'manager' || matrix.target != 'aarch64-apple-ios'
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
        run: cargo xtask release --component $env:COMPONENT --target $env:TARGET --version $env:VERSION --scope $env:RELEASE_SCOPE
      - name: Require a trusted exact-head iOS signing ref
        if: >-
          matrix.component == 'manager' && matrix.target == 'aarch64-apple-ios'
          && !(github.repository == 'Project-Shinkirou/ShinkiEMU' && github.ref_protected
            && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
              || startsWith(github.ref, 'refs/tags/manager-v'))
            && needs.select.outputs.source_commit == github.sha)
        shell: bash
        run: |
          echo "::error::The iOS device test IPA requires an exact-head release run on a protected Project-Shinkirou/ShinkiEMU main, release branch or Manager tag."
          exit 1
      - name: Prepare development-provisioned iOS device test release
        if: >-
          matrix.component == 'manager' && matrix.target == 'aarch64-apple-ios'
          && github.repository == 'Project-Shinkirou/ShinkiEMU' && github.ref_protected
          && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
            || startsWith(github.ref, 'refs/tags/manager-v'))
          && needs.select.outputs.source_commit == github.sha
        shell: bash
        env:
          SHINKI_EMU_IOS_CERTIFICATE_BASE64: ${{ secrets.SHINKI_EMU_IOS_CERTIFICATE_BASE64 }}
          SHINKI_EMU_IOS_CERTIFICATE_PASSWORD: ${{ secrets.SHINKI_EMU_IOS_CERTIFICATE_PASSWORD }}
          SHINKI_EMU_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.SHINKI_EMU_IOS_PROVISIONING_PROFILE_BASE64 }}
          SHINKI_EMU_IOS_ENTITLEMENTS_BASE64: ${{ secrets.SHINKI_EMU_IOS_ENTITLEMENTS_BASE64 }}
        run: |
          bash build/ci/ios-device-signing.sh cargo xtask release --component manager --target aarch64-apple-ios --version "$VERSION" --scope "$RELEASE_SCOPE"
      - uses: actions/upload-artifact@v7
        with:
          # Component ids and triples never contain '@', so handoff can select one component.
          name: release-files-${{ matrix.component }}@${{ matrix.target }}
          path: .work/release/
          include-hidden-files: true
          if-no-files-found: error
  handoff:
    needs: [select, build]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.components) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    env:
      COMPONENT: ${{ matrix.component }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-files-${{ matrix.component }}@*
          path: .work/release/
          merge-multiple: true
      - name: Require every build row of this component
        shell: bash
        env:
          MATRIX: ${{ needs.select.outputs.matrix }}
          RELEASE_TAG: ${{ matrix.tag }}
          SOURCE_COMMIT: ${{ needs.select.outputs.source_commit }}
        run: |
          set -euo pipefail
          # Prepared files sit at .work/release/<tag>/<target>/release.json.
          missing=$(jq -r --arg c "$COMPONENT" '.include[] | select(.component == $c) | .target' <<<"$MATRIX" \
            | while IFS= read -r target; do test -f ".work/release/$RELEASE_TAG/$target/release.json" || printf '%s ' "$target"; done)
          if test -n "$missing"; then
            echo "- **$COMPONENT $VERSION incomplete**: build rows failed or were cancelled: $missing" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$COMPONENT missing prepared build rows: $missing"
            exit 1
          fi
          while IFS= read -r target; do
            jq -e --arg component "$COMPONENT" --arg version "$VERSION" --arg target "$target" --arg scope "$RELEASE_SCOPE" --arg commit "$SOURCE_COMMIT" \
              '.component == $component and .version == $version and .target == $target and .release_scope == $scope and .source_commit == $commit' \
              ".work/release/$RELEASE_TAG/$target/release.json" >/dev/null
            if [[ "$COMPONENT" == manager && "$target" == *-apple-ios* ]]; then
              channel=ad-hoc-simulator-test
              if [[ "$target" == aarch64-apple-ios ]]; then channel=development-device-test; fi
              jq -e --arg version "$VERSION" --arg target "$target" --arg commit "$SOURCE_COMMIT" --arg channel "$channel" '
                .ios | .distribution == $channel and .source_commit == $commit
                and .version == $version and .target == $target and (.frameworks | type == "object")
              ' ".work/release/$RELEASE_TAG/$target/release.json" >/dev/null
            fi
          done < <(jq -r --arg c "$COMPONENT" '.include[] | select(.component == $c) | .target' <<<"$MATRIX")
      - name: Show local Manager release instructions
        if: matrix.component == 'manager' && needs.select.outputs.local_manager == 'true'
        run: |
          {
            echo "Manager $VERSION requires a DevEco-signed OHOS package."
            echo "Use a run without a source_commit override. Compare \`gh run view $GITHUB_RUN_ID --json headSha --jq .headSha\` with \`git rev-parse HEAD\` before combining artifacts."
            echo "Download this run's release-files-manager@* artifacts and merge their contents into .work/release/."
            echo "With DevEco and cargo-about installed, prepare the HAP from the same checkout:"
            echo '```sh'
            echo "cargo xtask release --component manager --target aarch64-unknown-linux-ohos --version $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize verified handoff
        env:
          SOURCE_COMMIT: ${{ needs.select.outputs.source_commit }}
        run: |
          echo "Prepared $COMPONENT $VERSION for scope $RELEASE_SCOPE from product SHA $SOURCE_COMMIT." >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the release-files artifacts for inspection. After reviewing the exact binaries and redistribution materials, publish locally with cargo xtask release --publish. This workflow does not create tags or releases.' >> "$GITHUB_STEP_SUMMARY"
