name: Component release
# One component: push its tag. Many components: dispatch this workflow.
# Preparation uses the selected exact product commit; prepare-only dispatches
# keep every build/source gate but never create a tag or public release.
on:
  push:
    tags: ['manager-v*', 'core-*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer for Manager/self-owned cores only; external core identities come from pinned upstream and adapter sources
        required: false
      components:
        description: 'Comma-separated manager/plugin_ids (case-sensitive), or all (every component that is not publish_blocked)'
        required: true
      verify_local_manager:
        description: 'Verify staged OHOS HAP/source in the draft Manager release; no rebuild or publication'
        type: boolean
        default: false
      prepare_only:
        description: 'Prepare and retain every selected platform without publishing; audit actual artifacts before a separate publication'
        type: boolean
        default: false
      source_commit:
        description: 'Optional exact lowercase 40-hex product SHA for prepare-only; omit to use the workflow commit'
        type: string
        required: false
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      components: ${{ steps.select.outputs.components }}
      version: ${{ steps.select.outputs.version }}
      local_manager: ${{ steps.select.outputs.local_manager }}
      source_commit: ${{ steps.select.outputs.source_commit }}
    steps:
      # The inventory needs the cpal submodule for workspace resolution, not LFS payloads.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          submodules: true
      - run: rustup show
      - id: select
        shell: pwsh
        env:
          INPUT_COMPONENTS: ${{ inputs.components }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:EXPECTED_SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'source_commit must be an exact lowercase 40-hex product SHA' }
          if ($env:INPUT_SOURCE_COMMIT -and $env:PREPARE_ONLY -ne 'true') { throw 'An explicit source_commit requires prepare_only=true' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checked-out product SHA differs from the selected source_commit' }
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT
          "Workflow dispatch SHA: $env:GITHUB_SHA; actual product/source SHA: $sourceCommit; prepare_only=$env:PREPARE_ONLY" >> $env:GITHUB_STEP_SUMMARY
          $localManager = @((cargo xtask matrix) | Where-Object { $_ -match '^manager\taarch64-unknown-linux-ohos\tsupported\t' }).Count -gt 0
          $rows = @((cargo xtask matrix --json --ci | ConvertFrom-Json).include)
          $known = @($rows.component | Sort-Object -Unique -CaseSensitive)
          $slug = { param($id) $id.ToLowerInvariant().Replace('.', '-').Replace('_', '-') }
          $version = $env:INPUT_VERSION.Trim()
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF_NAME -match '^manager-v(.+)$') {
              $requested = @('manager'); $version = $Matches[1]
            } else {
              $matched = @($known | Where-Object { $_ -ne 'manager' -and $env:GITHUB_REF_NAME.StartsWith("core-$(& $slug $_)-") })
              if ($matched.Count -ne 1) { throw "Tag $env:GITHUB_REF_NAME does not identify one core" }
              $requested = $matched
              $own = @($rows | Where-Object { $_.component -ceq $matched[0] })
              if (-not $own[0].external) {
                $version = $env:GITHUB_REF_NAME.Substring("core-$(& $slug $matched[0])-v".Length)
              }
            }
          } elseif ($env:INPUT_COMPONENTS.Trim() -ceq 'all') {
            $requested = @($known | Where-Object { $c = $_; -not ($rows | Where-Object { $_.component -ceq $c -and $_.publish_blocked }) })
          } else {
            $requested = @($env:INPUT_COMPONENTS.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Sort-Object -Unique -CaseSensitive)
          }
          if ($requested.Count -eq 0) { throw 'No components selected' }
          $versions = @{}
          $components = @()
          foreach ($component in $requested) {
            $own = @($rows | Where-Object { $_.component -ceq $component })
            if ($own.Count -eq 0) { throw "Unknown component '$component', or it has no supported target" }
            if ($own[0].publish_blocked) { throw "$component is publish_blocked: $($own[0].publish_blocked)" }
            $arguments = @('xtask', 'release', '--component', $component, '--dry-run')
            if (-not $own[0].external) { $arguments += @('--version', $version) }
            $identity = cargo @arguments | ConvertFrom-Json
            if ($env:GITHUB_EVENT_NAME -eq 'push' -and $identity.release_tag -cne $env:GITHUB_REF_NAME) { throw 'Tag does not match verified component identity' }
            $versions[$component] = $identity.version
            $components += @{component=$component; version=$identity.version}
          }
          $include = @($rows | Where-Object { $_.component -cin $requested } | ForEach-Object {
            $_ | Add-Member -NotePropertyName version -NotePropertyValue $versions[$_.component] -PassThru
          })
          "matrix=$(@{include=$include} | ConvertTo-Json -Compress -Depth 8)" >> $env:GITHUB_OUTPUT
          "components=$(@{include=$components} | ConvertTo-Json -Compress -Depth 8)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "local_manager=$($localManager.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "Per-component release identities: $($components | ConvertTo-Json -Compress)" >> $env:GITHUB_STEP_SUMMARY
  build:
    if: ${{ inputs.verify_local_manager != true }}
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      SHINKI_EMU_CI_VERSION: ${{ matrix.version }}
      ROUKAKU_SUBTITLE_VCPKG_ROOT: ${{ github.workspace }}/.work/vcpkg-subtitle
      SHINKI_EMU_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHINKI_EMU_ANDROID_KEYSTORE_BASE64 }}
      SHINKI_EMU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHINKI_EMU_ANDROID_KEYSTORE_PASSWORD }}
      SHINKI_EMU_ANDROID_KEY_ALIAS: ${{ secrets.SHINKI_EMU_ANDROID_KEY_ALIAS }}
      SHINKI_EMU_ANDROID_KEY_PASSWORD: ${{ secrets.SHINKI_EMU_ANDROID_KEY_PASSWORD }}
      SHINKI_EMU_ANDROID_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.source_commit }}
          submodules: true
          lfs: true
      - run: rustup show
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
        with:
          version: '3.02'
      - name: Apple native assembler prerequisite
        if: runner.os == 'macOS' && (matrix.component == 'kirikiroid2-web' || (matrix.component == 'manager' && contains(matrix.target, 'ios')))
        shell: bash
        run: brew install bison yasm
      - name: Linux desktop prerequisites
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config nasm yasm patchelf autoconf automake libtool libltdl-dev autoconf-archive python3-jinja2 python3-venv libxtst-dev libxxf86vm-dev bison flex gperf libssl-dev libasound2-dev libudev-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers xvfb xauth unzip jq
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-java@v6
        if: contains(matrix.target, 'android')
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Android native build prerequisites
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm yasm pkg-config build-essential cmake ninja-build ccache clang-18 llvm-18 lld-18 autoconf autoconf-archive automake libtool-bin python3-jinja2 patch unzip zip bc libssl-dev libbz2-dev liblzma-dev libavcodec-dev libavformat-dev libswresample-dev libswscale-dev libfreetype6-dev libfribidi-dev libsdl2-dev libsdl2-image-dev libsdl2-gfx-dev libsdl2-mixer-dev libsdl2-ttf-dev libjpeg-dev libharfbuzz-dev libassimp-dev bison flex
      - name: Android SDK
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Prepare dependencies
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup target add $env:TARGET
          if ($env:COMPONENT -eq 'manager') {
            cargo xtask deps --target $env:TARGET
            if ($env:TARGET.Contains('android')) {
              $other = if ($env:TARGET -eq 'aarch64-linux-android') { 'x86_64-linux-android' } else { 'aarch64-linux-android' }
              rustup target add $other
              cargo xtask deps --target $other
            }
          }
          else { cargo xtask deps --target $env:TARGET --core $env:COMPONENT }
      - name: Preserve failed Renpy host NASM configuration
        if: failure() && matrix.component == 'manager' && contains(matrix.target, 'android')
        uses: actions/upload-artifact@v7
        with:
          name: renpy-nasm-host-config-${{ matrix.component }}-${{ matrix.target }}
          path: .work/renpy-build/tmp/build/nasm.host/nasm-2.14.02/config.log
          include-hidden-files: true
          if-no-files-found: warn
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
        run: cargo xtask ci --target $env:TARGET --component $env:COMPONENT --report .work/ci-report.json
      - name: Smoke packaged Linux Manager
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.component == 'manager'
        shell: bash
        run: |
          bash build/ci/linux-manager-smoke.sh "$(jq -er '.artifact' .work/ci-report.json)"
      - name: Prepare Release files
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
        run: cargo xtask release --component $env:COMPONENT --target $env:TARGET --version $env:SHINKI_EMU_CI_VERSION
      - uses: actions/upload-artifact@v7
        with:
          # Component ids and triples never contain '@', so publish can select one component.
          name: release-files-${{ matrix.component }}@${{ matrix.target }}
          path: .work/release/
          include-hidden-files: true
          if-no-files-found: error
  verify-ohos-handoff:
    needs: select
    if: ${{ inputs.verify_local_manager == true }}
    runs-on: ubuntu-24.04
    # GitHub hides draft releases from read-only tokens. This job only downloads
    # and verifies the unpublished assets; it never publishes the draft.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.select.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.source_commit }}
          submodules: true
      - run: rustup show
      - name: Download actual test-signed HAP and corresponding source from draft
        shell: bash
        run: |
          set -euo pipefail
          root=".work/release/manager-v$VERSION/aarch64-unknown-linux-ohos"
          mkdir -p "$root"
          gh release download "manager-v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$root" \
            --pattern '*ohos*' --pattern ohos-handoff.json
          mv "$root/ohos-handoff.json" "$root/release.json"
          cargo xtask release --component manager --version "$VERSION" --verify-handoff
          echo "Verified exact-head OHOS HAP/source hashes and native closure. DevEco verified the test-PKI signature locally; no device launch or retail-installability acceptance." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-ohos-handoff
          path: .work/release/
          if-no-files-found: error
  publish:
    needs: [select, build]
    # Failed build rows fail only their own component's publish job.
    if: ${{ !cancelled() && needs.select.result == 'success' && inputs.verify_local_manager != true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.components) }}
    concurrency:
      group: publish-${{ matrix.component }}-${{ matrix.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      COMPONENT: ${{ matrix.component }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.source_commit }}
          submodules: true
      - run: rustup show
      - uses: actions/download-artifact@v8
        with:
          pattern: release-files-${{ matrix.component }}@*
          path: .work/release/
          merge-multiple: true
      - name: Require every build row of this component
        shell: bash
        env:
          MATRIX: ${{ needs.select.outputs.matrix }}
          SOURCE_COMMIT: ${{ needs.select.outputs.source_commit }}
        run: |
          set -euo pipefail
          # Prepared files sit at .work/release/<tag>/<target>/release.json.
          missing=$(jq -r --arg c "$COMPONENT" '.include[] | select(.component == $c) | .target' <<<"$MATRIX" \
            | while IFS= read -r target; do compgen -G ".work/release/*/$target/release.json" >/dev/null || printf '%s ' "$target"; done)
          if test -n "$missing"; then
            echo "- **$COMPONENT $VERSION skipped**: build rows failed or were cancelled: $missing" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$COMPONENT not published; build rows failed or were cancelled: $missing"
            exit 1
          fi
          while IFS= read -r target; do
            records=(.work/release/*/"$target"/release.json)
            test "${#records[@]}" -eq 1
            jq -e --arg commit "$SOURCE_COMMIT" --arg component "$COMPONENT" --arg version "$VERSION" --arg target "$target" \
              '.source_commit == $commit and .component == $component and .version == $version and .target == $target' \
              "${records[0]}" >/dev/null
          done < <(jq -r --arg c "$COMPONENT" '.include[] | select(.component == $c) | .target' <<<"$MATRIX")
      - name: Local Manager artifact handoff
        if: matrix.component == 'manager' && needs.select.outputs.local_manager == 'true'
        run: |
          echo "Manager $VERSION requires its DevEco-signed local-only artifact. Download all release-files-manager@* artifacts from this exact-head run, prepare the OHOS release record locally, and publish only after ci.yml succeeds at the same head SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare-only artifact handoff
        if: inputs.prepare_only == true
        env:
          SOURCE_COMMIT: ${{ needs.select.outputs.source_commit }}
        run: |
          echo "Prepared every $COMPONENT platform from actual product/source SHA $SOURCE_COMMIT (workflow dispatch SHA $GITHUB_SHA). No tag or public release was created. Download this run's release-files artifacts and audit their actual binary/source/native/license bytes before publishing from the clean product commit." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish every prepared platform as one Release
        id: publish
        if: inputs.prepare_only != true && (matrix.component != 'manager' || needs.select.outputs.local_manager != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release --component "$COMPONENT" --version "$VERSION" --publish
      - name: Summary
        if: always() && steps.publish.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if test "$OUTCOME" = success; then
            echo "- $COMPONENT $VERSION published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **$COMPONENT $VERSION publish failed**: see the publish step log" >> "$GITHUB_STEP_SUMMARY"
          fi
