name: Metadata review intake
on:
  issues:
    types: [labeled, edited]
  pull_request:
    paths: ['Metadata/**']
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
concurrency:
  group: metadata-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  intake:
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Invalidate approval when the body changes
        if: github.event.action == 'edited'
        shell: bash
        run: |
          set -euo pipefail
          number=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
          for label in compat:accepted patch:accepted; do
            gh api --method DELETE "repos/$GH_REPO/issues/$number/labels/$label" || true
          done
          gh pr list --head "metadata/issue-$number" --json number --jq '.[].number' | while read -r pr; do
            gh pr close "$pr" --comment 'Issue changed after approval. Review and reapply the approval label.'
          done
      - name: Check approval authority and capture current issue
        if: github.event.action == 'labeled'
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          label=$(jq -r '.label.name' "$GITHUB_EVENT_PATH")
          case "$label" in compat:accepted) kind=compatibility;; patch:accepted) kind=patch;; *) exit 0;; esac
          actor=$(jq -r '.sender.login' "$GITHUB_EVENT_PATH")
          permission=$(gh api "repos/$GH_REPO/collaborators/$actor/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo 'Labeler lacks approval permission'; exit 1;; esac
          number=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
          gh api "repos/$GH_REPO/issues/$number" > issue.json
          jq -e --slurpfile event "$GITHUB_EVENT_PATH" '.body == $event[0].issue.body and .updated_at == $event[0].issue.updated_at' issue.json
          jq '{issue:.}' issue.json > intake-event.json
          printf 'kind=%s\nnumber=%s\n' "$kind" "$number" >> "$GITHUB_OUTPUT"
      - name: Parse reviewed data and update the issue branch
        if: steps.approval.outputs.kind != ''
        env:
          KIND: ${{ steps.approval.outputs.kind }}
          NUMBER: ${{ steps.approval.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask metadata intake --kind "$KIND" --event intake-event.json --out .work/intake
          branch="metadata/issue-$NUMBER"
          path=$(jq -r .path .work/intake/approval.json)
          if git ls-remote --exit-code --heads origin "$branch"; then
            git fetch origin "$branch"
            # Existing branches must belong to this issue and still be based on current main.
            git show "FETCH_HEAD:Metadata/intake/$NUMBER.json" > previous.json
            jq -e --argjson number "$NUMBER" '.issue == $number' previous.json
            old_path=$(jq -er .path previous.json)
            [[ "$old_path" =~ ^(compatibility/entries|patches/entries)/[A-Za-z0-9._/-]+\.json$ && "$old_path" != *..* ]]
            git diff --name-only origin/main FETCH_HEAD > previous-paths.txt
            while IFS= read -r changed; do
              test "$changed" = "Metadata/intake/$NUMBER.json" || test "$changed" = "Metadata/$old_path"
            done < previous-paths.txt
            git merge-base --is-ancestor origin/main FETCH_HEAD
            git switch -c "$branch" FETCH_HEAD
            if test "$old_path" != "$path"; then
              if git cat-file -e "origin/main:Metadata/$old_path"; then
                git restore --source=origin/main --staged --worktree -- "Metadata/$old_path"
              else
                git rm -- "Metadata/$old_path"
              fi
            fi
          else
            git switch -c "$branch" origin/main
          fi
          # Generated paths have already passed Rust path and identity validation.
          mkdir -p "$(dirname "Metadata/$path")" Metadata/intake
          cp ".work/intake/Metadata/$path" "Metadata/$path"
          cp .work/intake/approval.json "Metadata/intake/$NUMBER.json"
          cargo xtask metadata validate
          gh api "repos/$GH_REPO/issues/$NUMBER" > current.json
          jq -e --slurpfile approved .work/intake/approval.json '.updated_at == $approved[0].updated_at' current.json
          jq -j .body current.json | sha256sum | cut -d ' ' -f 1 > current.sha256
          test "$(cat current.sha256)" = "$(jq -r .body_sha256 .work/intake/approval.json)"
          git add -- "Metadata/$path" "Metadata/intake/$NUMBER.json"
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "metadata: reviewed issue $NUMBER"
            git push origin "HEAD:refs/heads/$branch"
          fi
          gh pr list --head "$branch" --state open --json number > prs.json
          if test "$(jq length prs.json)" = 0; then
            printf 'Reviewed issue #%s. Approval body hash and updated_at are stored in Metadata/intake/%s.json.\n' "$NUMBER" "$NUMBER" > pr-body.txt
            gh pr create --base main --head "$branch" --title "metadata: reviewed issue $NUMBER" --body-file pr-body.txt > pr-url.txt
          fi
          # GITHUB_TOKEN pushes need not trigger PR workflows: report the same validation now.
          sha=$(git rev-parse HEAD)
          jq -n --arg sha "$sha" '{name:"metadata-review",head_sha:$sha,status:"completed",conclusion:"success",output:{title:"Reviewed metadata validated",summary:"Schema, keyed paths, references and approval binding validated."}}' > check.json
          gh api --method POST "repos/$GH_REPO/check-runs" --input check.json
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate metadata with trusted main tooling
        shell: bash
        run: |
          set -euo pipefail
          number=$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")
          git fetch origin "refs/pull/$number/head"
          sha=$(git rev-parse FETCH_HEAD)
          # Read data from the PR, never its code, workflows or scripts.
          git diff --name-only origin/main FETCH_HEAD > paths.txt
          while IFS= read -r path; do
            case "$path" in Metadata/compatibility/entries/*.json|Metadata/patches/entries/*.json|Metadata/engines/cores/*.json|Metadata/engines/presets/*.json|Metadata/intake/*.json) ;; *) echo "Non-data change requires normal product CI: $path"; exit 1;; esac
            if git cat-file -e "FETCH_HEAD:$path"; then
              mode=$(git ls-tree FETCH_HEAD -- "$path" | cut -d ' ' -f 1)
              test "$mode" = 100644
              mkdir -p "$(dirname "$path")"
              git show "FETCH_HEAD:$path" > "$path"
            else
              rm -f -- "$path"
            fi
          done < paths.txt
          cargo xtask metadata validate
          head=$(jq -r .pull_request.head.ref "$GITHUB_EVENT_PATH")
          if [[ "$head" == metadata/issue-* ]]; then
            issue=${head#metadata/issue-}
            [[ "$issue" =~ ^[0-9]+$ ]]
            binding="Metadata/intake/$issue.json"
            test -f "$binding"
            gh api "repos/$GH_REPO/issues/$issue" > live.json
            jq -e --slurpfile binding "$binding" '.updated_at == $binding[0].updated_at and any(.labels[]; .name == "compat:accepted" or .name == "patch:accepted")' live.json
            jq -j .body live.json | sha256sum | cut -d ' ' -f 1 > live.sha256
            test "$(cat live.sha256)" = "$(jq -r .body_sha256 "$binding")"
            kind=$(jq -r 'if any(.labels[]; .name == "compat:accepted") then "compatibility" else "patch" end' live.json)
            jq '{issue:.}' live.json > reviewed-event.json
            cargo xtask metadata intake --kind "$kind" --event reviewed-event.json --out .work/reviewed
            cmp "$binding" .work/reviewed/approval.json
            path=$(jq -r .path "$binding")
            cmp "Metadata/$path" ".work/reviewed/Metadata/$path"
            # An approved issue branch may change only its entry and binding.
            while IFS= read -r changed; do
              test "$changed" = "$binding" || test "$changed" = "Metadata/$path"
            done < paths.txt
          fi
          jq -n --arg sha "$sha" '{name:"metadata-review",head_sha:$sha,status:"completed",conclusion:"success",output:{title:"Metadata validated",summary:"Trusted main validator and live approval binding passed."}}' > check.json
          gh api --method POST "repos/$GH_REPO/check-runs" --input check.json
