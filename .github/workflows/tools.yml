name: Host tools
on:
  workflow_call:
    inputs:
      ref:
        description: Product commit to test; omit for the calling workflow's ref
        type: string
      lint:
        description: Also check formatting, Clippy and the committed C ABI header
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tools:
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: true
          lfs: true
      - run: rustup show
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cargo install --locked cbindgen@0.29.2
        if: inputs.lint
      - name: Verify the committed C ABI header
        if: inputs.lint
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          cbindgen --config Source/FamilyApi/shinki-emu-abi/cbindgen.toml --crate shinki-emu-abi --metadata "$RUNNER_TEMP/metadata.json" --output "$RUNNER_TEMP/shinki_emu.h" Source/FamilyApi/shinki-emu-abi
          git diff --no-index --ignore-cr-at-eol --exit-code Source/FamilyApi/shinki-emu-abi/include/shinki_emu.h "$RUNNER_TEMP/shinki_emu.h"
      - run: cargo fmt --check
        if: inputs.lint
      - run: cargo clippy --locked -p xtask -p shinki-emu-build --all-targets -- -D warnings
        if: inputs.lint
      - run: cargo test --locked -p xtask -p shinki-emu-build
      - run: cargo xtask metadata validate
