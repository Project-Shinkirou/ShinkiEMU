name: CI
# The full matrix runs only on push/dispatch; pull requests use pr-ci.yml.
# Catalog-only changes are validated by metadata-intake.yml; documentation builds nothing.
on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['Metadata/**', 'docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      since:
        description: 'Compare build inputs against this Git ref; empty runs the full matrix'
        type: string
        default: ''
      components:
        description: 'Optional comma-separated component ids within the affected matrix'
        type: string
        default: ''
      targets:
        description: 'Optional comma-separated target triples within the affected matrix'
        type: string
        default: ''
      release_scope:
        description: 'Run the entire selected platform scope; cannot be combined with row filters'
        type: choice
        options: [all, windows-android]
        default: all
      upload_packages:
        description: 'Upload binaries for the selected rows; confirm redistribution rights before enabling'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  matrix:
    name: ${{ inputs.release_scope == 'windows-android' && 'release-scope (windows-android)' || 'matrix' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Workspace resolution needs the cpal submodule; the inventory needs no LFS payloads.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - run: rustup show
      - id: matrix
        shell: bash
        env:
          SINCE: ${{ inputs.since }}
          COMPONENTS: ${{ inputs.components }}
          TARGETS: ${{ inputs.targets }}
          RELEASE_SCOPE: ${{ inputs.release_scope || 'all' }}
        run: |
          args=(--json --ci)
          if [[ "$RELEASE_SCOPE" != all ]]; then
            if [[ -n "$SINCE$COMPONENTS$TARGETS" ]]; then
              echo 'A platform scope cannot be combined with since/components/targets' >&2
              exit 1
            fi
            args+=(--scope "$RELEASE_SCOPE")
          fi
          if [[ -n "$SINCE" ]]; then args+=(--since "$SINCE"); fi
          matrix=$(cargo xtask matrix "${args[@]}")
          if [[ -n "$COMPONENTS" ]]; then
            matrix=$(jq -ce --arg components "$COMPONENTS" '
              ($components | split(",")) as $ids
              | .include |= map(select(.component as $id | $ids | index($id)))
              | if (.include | length) == 0 then error("No matching affected components") else . end' <<< "$matrix")
          fi
          if [[ -n "$TARGETS" ]]; then
            matrix=$(jq -ce --arg targets "$TARGETS" '
              ($targets | split(",")) as $ids
              | .include |= map(select(.target as $id | $ids | index($id)))
              | if (.include | length) == 0 then error("No matching affected targets") else . end' <<< "$matrix")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  tools:
    uses: ./.github/workflows/tools.yml
    with:
      lint: true
  component:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      # CI packages are test builds; release.yml packages the released version.
      SHINKI_EMU_CI_VERSION: 0.0.0-ci.${{ github.run_number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
      - uses: actions/cache@v5
        with:
          path: .work/vcpkg-binary-cache
          key: vcpkg-${{ matrix.target }}-${{ matrix.component }}-${{ hashFiles('build/dependencies.toml', 'build/vcpkg/**', 'Cargo.lock') }}
      - run: rustup show
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
        with:
          version: '3.02'
      - name: Apple native prerequisites
        if: runner.os == 'macOS' && (matrix.component == 'kirikiroid2-web' || (matrix.component == 'manager' && matrix.platform == 'ios'))
        shell: bash
        run: |
          brew install bison yasm
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          rustup component add llvm-tools-preview
      - name: Linux desktop prerequisites
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config nasm yasm patchelf autoconf automake libtool libltdl-dev autoconf-archive python3-jinja2 python3-venv libxtst-dev libxxf86vm-dev libxinerama-dev bison flex gperf libssl-dev libasound2-dev libudev-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers xvfb xauth unzip jq
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: KiriKiri desktop prerequisites
        if: runner.os == 'macOS' && matrix.component == 'kirikiroid2-web'
        shell: bash
        run: |
          brew install autoconf automake autoconf-archive libtool gperf
          echo "$(brew --prefix gperf)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        if: contains(matrix.target, 'android')
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Android native build prerequisites
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm yasm pkg-config build-essential cmake ninja-build ccache clang-18 llvm-18 lld-18 autoconf autoconf-archive automake libtool-bin python3-jinja2 patch unzip zip bc libssl-dev libbz2-dev liblzma-dev libavcodec-dev libavformat-dev libswresample-dev libswscale-dev libfreetype6-dev libfribidi-dev libsdl2-dev libsdl2-image-dev libsdl2-gfx-dev libsdl2-mixer-dev libsdl2-ttf-dev libjpeg-dev libharfbuzz-dev libassimp-dev bison flex
      - name: Select Android SDK
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        if: matrix.platform == 'android'
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add $env:TARGET
      - name: Install the second ABI for the universal Android Manager
        if: matrix.target == 'aarch64-linux-android' && matrix.component == 'manager'
        run: rustup target add x86_64-linux-android
      - run: cargo install cargo-about --version 0.9.3 --locked --features cli --bin cargo-about
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
        run: cargo xtask ci --target $env:TARGET --component $env:COMPONENT --report .work/ci-report.json
      - name: Smoke packaged Linux Manager
        continue-on-error: true
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.component == 'manager'
        shell: bash
        run: |
          bash build/ci/linux-manager-smoke.sh "$(jq -er '.artifact' .work/ci-report.json)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ matrix.component }}-${{ matrix.target }}
          path: .work/ci-report.json
          if-no-files-found: error
      - name: Select real distributable artifact
        id: artifact
        env:
          REPORT: .work/ci-report.json
        run: |
          $report = Get-Content -Raw $env:REPORT | ConvertFrom-Json
          if ($null -ne $report.artifact) { "path=$($report.artifact)" >> $env:GITHUB_OUTPUT }
      - uses: actions/upload-artifact@v7
        if: inputs.upload_packages == true && steps.artifact.outputs.path != ''
        with:
          name: ${{ matrix.component }}-${{ matrix.target }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
