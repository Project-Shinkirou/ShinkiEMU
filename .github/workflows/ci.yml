name: CI
# Catalog-only changes are validated by metadata-intake.yml; documentation builds nothing.
on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['Metadata/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['Metadata/**', 'docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      since:
        description: 'Compare build inputs against this Git ref; empty runs the full matrix'
        type: string
        default: ''
      components:
        description: 'Optional comma-separated component ids within the affected matrix'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Workspace resolution needs the cpal submodule; the inventory needs no LFS payloads.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - run: rustup show
      - id: matrix
        shell: bash
        env:
          SINCE: ${{ inputs.since }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          args=(--json --ci)
          if [[ -n "$SINCE" ]]; then args+=(--since "$SINCE"); fi
          matrix=$(cargo xtask matrix "${args[@]}")
          if [[ -n "$COMPONENTS" ]]; then
            matrix=$(jq -ce --arg components "$COMPONENTS" '
              ($components | split(",")) as $ids
              | .include |= map(select(.component as $id | $ids | index($id)))
              | if (.include | length) == 0 then error("No matching affected components") else . end' <<< "$matrix")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  tools:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
      - run: rustup show
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cargo fmt --check
      - run: cargo clippy --locked -p xtask -p shinki-emu-build --all-targets -- -D warnings
      - run: cargo test --locked -p xtask -p shinki-emu-build
      - run: cargo xtask metadata validate
  component:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      # CI packages are test builds; release.yml packages the released version.
      SHINKI_EMU_CI_VERSION: 0.0.0-ci.${{ github.run_number }}
      ROUKAKU_SUBTITLE_VCPKG_ROOT: ${{ github.workspace }}/.work/vcpkg-subtitle
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
      - run: rustup show
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
        with:
          version: '3.02'
      - name: Linux desktop prerequisites
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config nasm patchelf autoconf automake libtool bison flex gperf libssl-dev libasound2-dev libudev-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers xvfb xauth unzip jq
          sudo apt-get install -y --no-install-recommends autoconf-archive libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-java@v6
        if: contains(matrix.target, 'android')
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Android native build prerequisites
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config
      - name: Select Android SDK
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Prepare target dependencies
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup target add $env:TARGET
          if ($env:COMPONENT -eq 'manager') {
            cargo xtask deps --target $env:TARGET
            if ($env:TARGET.Contains('android')) {
              $other = if ($env:TARGET -eq 'aarch64-linux-android') { 'x86_64-linux-android' } else { 'aarch64-linux-android' }
              rustup target add $other
              cargo xtask deps --target $other
            }
          } else {
            cargo xtask deps --target $env:TARGET --core $env:COMPONENT
          }
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT: ${{ matrix.component }}
        run: cargo xtask ci --target $env:TARGET --component $env:COMPONENT --report .work/ci-report.json
      - name: Smoke packaged Linux Manager
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.component == 'manager'
        shell: bash
        run: |
          bash build/ci/linux-manager-smoke.sh "$(jq -er '.artifact' .work/ci-report.json)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ matrix.component }}-${{ matrix.target }}
          path: .work/ci-report.json
          if-no-files-found: error
      - name: Select real distributable artifact
        id: artifact
        env:
          REPORT: .work/ci-report.json
        run: |
          $report = Get-Content -Raw $env:REPORT | ConvertFrom-Json
          if ($null -ne $report.artifact) { "path=$($report.artifact)" >> $env:GITHUB_OUTPUT }
      - uses: actions/upload-artifact@v7
        if: steps.artifact.outputs.path != ''
        with:
          name: ${{ matrix.component }}-${{ matrix.target }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
