name: Compatibility report
description: Report a specific release, core and target combination
body:
  - type: markdown
    attributes:
      value: Do not include keys, game text, commercial assets or saves. Reports require maintainer review.
  - type: input
    id: vid
    attributes:
      label: VNDB vID
    validations:
      required: true
  - type: input
    id: rid
    attributes:
      label: VNDB rID
    validations:
      required: true
  - type: dropdown
    id: emulator
    attributes:
      label: Core
      options:
        - rfvp
        - siglus_rs
        - art3m1s-core
        - shinki.emu.musica
        - sena-rs
        - kirikiroid2-web
        - ethornell-rs
        - shinki.emu.cmvs
        - ReMinori
        - impacto
        - renpy
    validations:
      required: true
  - type: input
    id: emulator_version
    attributes:
      label: Core version
    validations:
      required: true
  - type: input
    id: manager_version
    attributes:
      label: Manager version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - windows
        - linux
        - macos
        - android
        - ios
        - ohos
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64
        - aarch64
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Variant
      options:
        - desktop
        - device
        - simulator
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - perfect
        - completable
        - flawed
        - boot_only
        - unplayable
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / reproduction
    validations:
      required: true
