[package]
name = "shinki-emu-adv32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
dynamic-plugin-export = []
video-ffmpeg = ["shinki-emu-sdk/video-ffmpeg"]

[dependencies]
cosmic-text.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
image.workspace = true
kira.workspace = true
lru.workspace = true
object.workspace = true
roukaku-media-core.workspace = true
rustfft.workspace = true
shinki-emu-abi = { path = "../../FamilyApi/shinki-emu-abi", features = ["diagnostic-bridge"] }
shinki-emu-sdk = { path = "../../SDK/shinki-emu-sdk", default-features = false, features = ["runtime", "image", "text", "audio"] }
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["local-offset"] }

[target.'cfg(not(target_env = "ohos"))'.dependencies]
shinki-emu-sdk = { path = "../../SDK/shinki-emu-sdk", default-features = false, features = ["device-audio"] }
pollster.workspace = true
roukaku-byte-source.workspace = true
roukaku-core.workspace = true
roukaku-platform.workspace = true
roukaku-platform-common.workspace = true
roukaku-text.workspace = true
tracing.workspace = true

[build-dependencies]
shinki-emu-build = { path = "../../Tools/shinki-emu-build" }
