[package]
name = "shinki-emu-core-ethornell-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
publish = false

[lib]
name = "shinki_emu_ethornell_rs"
crate-type = ["cdylib"]

[dependencies]
shinki-emu-ethornell-rs = { workspace = true, features = ["diagnostic-bridge"] }

[target.'cfg(target_os = "android")'.dependencies]
# CPAL's Oboe backend needs the packaged NDK C++ runtime in this DSO.
oboe = { workspace = true, features = ["shared-stdcxx"] }
