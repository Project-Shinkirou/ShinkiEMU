[package]
name    = "ffmpeg-sys-next"
version = "9.0.1"
build   = "build.rs"
links   = "ffmpeg"
edition = "2024"

authors = ["meh. <meh@schizofreni.co>", "Zhiming Wang <i@zhimingwang.org>"]
license = "WTFPL"

description = "FFI bindings to FFmpeg"
repository  = "https://github.com/zmwangx/rust-ffmpeg-sys"
keywords    = ["audio", "video"]

[lib]
# Disable doctests as a workaround for https://github.com/rust-lang/rust-bindgen/issues/1313
doctest = false

[dependencies]
libc = "0.2"
shinki-emu-ffmpeg = { path = "../shinki-emu-ffmpeg" }

[build-dependencies]
shinki-emu-build = { path = "../../Tools/shinki-emu-build" }
cc         = "1.6"
pkg-config = "0.3"
bindgen    = { version = "0.73", default-features = false, features = ["runtime"] }

[target.'cfg(target_env = "msvc")'.build-dependencies]
vcpkg = "0.2"

[features]
default  = ["avcodec", "avdevice", "avfilter", "avformat", "swresample", "swscale"]

static = []

# mark enums in generated bindings as #[non_exhaustive]
non-exhaustive-enums = []

# components
avcodec    = []
avdevice   = ["avformat"]
avfilter   = []
avformat   = ["avcodec"]
avresample = []
postproc   = []
swresample = []
swscale    = []
