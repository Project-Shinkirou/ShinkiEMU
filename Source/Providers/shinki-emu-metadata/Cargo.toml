[package]
name = "shinki-emu-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
hex.workspace = true
image.workspace = true
reqwest.workspace = true
# bangumi-api 0.1.2 and vn 0.11.2 expose reqwest 0.12 types in their public API.
reqwest12 = { package = "reqwest", version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
url.workspace = true
vn.workspace = true

# bangumi-api 0.1.2 still enables reqwest's default native-tls backend. Android
# and OHOS have no system OpenSSL provider; keep this optional provider out of
# those targets rather than cross-building OpenSSL.
[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
bangumi-api.workspace = true

[dev-dependencies]
parking_lot = "0.13.0"
rcgen.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-rustls.workspace = true
