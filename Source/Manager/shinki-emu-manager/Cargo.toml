[package]
name = "shinki-emu-manager"
version = "0.1.0-beta.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

[[bin]]
name = "shinki-emu-manager"
path = "src/bin_main.rs"

[features]
default = ["store-steam", "store-dlsite", "store-dmm"]
store-steam = ["dep:shinki-emu-steam"]
store-dlsite = ["dep:shinki-emu-dlsite"]
store-dmm = ["dep:shinki-emu-dmm"]

[dependencies]
shinki-emu-manager-core = { path = "../shinki-emu-manager-core" }
shinki-emu-manager-ui-slint = { path = "../shinki-emu-manager-ui-slint" }
shinki-emu-abi = { path = "../../FamilyApi/shinki-emu-abi" }
shinki-emu-patch = { path = "../../Tools/shinki-emu-patch" }
shinki-emu-musica-keys = { path = "../../Families/shinki-emu-musica-keys" }
mlua.workspace = true
shinki-emu-metadata = { path = "../../Providers/shinki-emu-metadata" }
shinki-emu-translation = { path = "../../Providers/shinki-emu-translation" }
shinki-emu-store = { path = "../../Providers/shinki-emu-store" }
shinki-emu-steam = { path = "../../Providers/shinki-emu-steam", optional = true }
shinki-emu-dlsite = { path = "../../Providers/shinki-emu-dlsite", optional = true }
shinki-emu-dmm = { path = "../../Providers/shinki-emu-dmm", optional = true }
open = "5.3"
roukaku-observability = { workspace = true }
roukaku-media-core = { workspace = true }
roukaku-core.workspace = true
roukaku-text.workspace = true
clap.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
ctrlc.workspace = true
naga = { version = "30.0.1", features = ["spv-in", "wgsl-out"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
tokio.workspace = true
directories.workspace = true
pollster.workspace = true
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
semver.workspace = true
parking_lot = "0.13.0"
serde_json.workspace = true
zip = { version = "=9.1.0", default-features = false, features = ["deflate"] }
sha2.workspace = true
hex.workspace = true
slint = { workspace = true, features = ["std", "compat-1-2", "accessibility", "unstable-wgpu-30"] }
thiserror.workspace = true
tempfile.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true
hassle-rs = "=0.12.0"
wgpu = { version = "30.0.1", features = ["static-dxc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(any(target_os = "windows", all(target_os = "linux", not(target_env = "ohos")), target_os = "macos"))'.dependencies]
gilrs = { workspace = true, features = ["wgi"] }
rfd.workspace = true

[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg-wgpu", "unstable-winit-030", "raw-window-handle-06"] }
winit.workspace = true

# Store sign-in runs in the system webview: WebView2 (Windows) and
# WKWebView (macOS, iOS) as a child view of the Manager window, WebKitGTK in
# its own GTK window on Linux. Android uses android.webkit.WebView over JNI.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
wry = { version = "=0.57.1", default-features = false }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
gtk = "=0.18.2"


# OpenHarmony runs a Slint custom platform: the software renderer draws into
# XComponent OHNativeWindow buffers; NAPI and OHAudio glue lives in
# Platforms/OHOS/native and is compiled by build.rs.
[target.'cfg(target_env = "ohos")'.dependencies]
slint = { workspace = true, features = ["renderer-software"] }
# fontique reaches fontconfig only through dlopen; OHOS ships no fontconfig and
# the Manager registers its bundled CJK faces itself.
fontique = { version = "=0.11.1", features = ["fontconfig-dlopen"] }
shinki-emu-sdk = { path = "../../SDK/shinki-emu-sdk", default-features = false, features = ["runtime"] }
shinki-emu-musica = { path = "../../Families/shinki-emu-musica", default-features = false, features = ["ffmpeg-vcpkg"] }

[target.'cfg(target_os = "ios")'.dependencies]
roukaku-platform.workspace = true
# Positions the sign-in WKWebView inside the Manager view.
objc2.workspace = true
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
shinki-emu-rfvp = { git = "https://github.com/Project-Shinkirou/rfvp", rev = "9a5c20026e3638ef5714c2ad7062634648c8dfcf", default-features = false }
shinki-emu-siglus_rs = { git = "https://github.com/Project-Shinkirou/siglus_rs", rev = "d0923af499912b82a3021b7998f44b2c88d52f84", default-features = false }
shinki-emu-musica = { path = "../../Families/shinki-emu-musica", default-features = false, features = ["ffmpeg-vcpkg"] }
shinki-emu-sena-rs = { git = "https://github.com/Project-Shinkirou/sena-rs", rev = "22ac45acc6a436516333a85a4ac3b8470e1cc574", default-features = false }
shinki-emu-ethornell-rs = { git = "https://github.com/Project-Shinkirou/ethornell-rs", rev = "f8362be7d2f4d634c25a98a317dfe56ffae56346", default-features = false }
shinki-emu-ReMinori = { git = "https://github.com/Project-Shinkirou/ReMinori", rev = "0eec31a7d1412ea9061ee1cff2d64ab6133bda00", default-features = false }
# The static iOS graph links ReMinori's naga 26 and Ruffle's naga 27; both share
# codespan-reporting 0.12, and naga 27 enables its termcolor feature. naga 26
# selects its diagnostic buffer type from its own `termcolor` feature, so it must
# be enabled too or the unified codespan API rejects naga 26's String buffer.
naga-26 = { package = "naga", version = "26.0.0", default-features = false, features = ["termcolor"] }
[target.'cfg(target_os = "android")'.dependencies]
shinki-emu-rfvp = { git = "https://github.com/Project-Shinkirou/rfvp", rev = "9a5c20026e3638ef5714c2ad7062634648c8dfcf", default-features = false }
shinki-emu-siglus_rs = { git = "https://github.com/Project-Shinkirou/siglus_rs", rev = "d0923af499912b82a3021b7998f44b2c88d52f84", default-features = false }
shinki-emu-musica = { path = "../../Families/shinki-emu-musica", default-features = false, features = ["ffmpeg-vcpkg"] }
shinki-emu-art3m1s-core = { git = "https://github.com/Project-Shinkirou/art3m1s-core", rev = "5243005cf0aaaeac89b1803e57381e9c0b14b95c", default-features = false, features = ["static-core"] }
# Slint gates winit/femtovg out of its Android graph; the Manager renders
# through the android-activity backend with the wgpu-30 Skia renderer, and the
# NativeActivity glue is the single activity backend linked into the process.
slint = { workspace = true, features = ["backend-android-activity-06"] }
android-activity = { version = "=0.6.1", default-features = false, features = ["native-activity"] }
jni = "=0.22.4"
ndk = { version = "=0.9.0", default-features = false }
libc.workspace = true
# reqwest's rustls backend verifies certificates through the platform
# verifier, which needs the activity context on Android (`platform::android`).
rustls-platform-verifier = "=0.7.1"

[build-dependencies]
sha2.workspace = true
resvg = "0.48.1"
ico = "0.3.0"
winresource = "0.1.34"
# Compiles the OHOS NAPI/XComponent/OHAudio glue only for target_env = "ohos".
cc = "1.10.0"

[dev-dependencies]
crc32fast = "1.5.3"
flate2.workspace = true
