[package]
name = "shinki-emu-manager-ui-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
doctest = false

[dependencies]
serde.workspace = true
slint = { workspace = true, features = ["std", "compat-1-2", "serde", "backend-winit", "renderer-femtovg-wgpu"] }
image = { workspace = true, features = ["gif"] }
tracing.workspace = true
parking_lot = "0.13.0"
# Steam QR login is rendered locally; the challenge URL never leaves the device.
qrcodegen = "=1.8.0"

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
