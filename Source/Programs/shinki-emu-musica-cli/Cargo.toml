[package]
name = "shinki-emu-musica-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shinki-emu-musica-cli"
path = "src/main.rs"

[dependencies]
roukaku-core = { workspace = true }
shinki-emu-musica = { path = "../../Families/shinki-emu-musica" }
shinki-emu-musica-keys = { path = "../../Families/shinki-emu-musica-keys" }
roukaku-observability = { workspace = true }
clap.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml = "1.1"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
