[package]
name = "shinki-emu-build"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
description = "Host-side native core build support for ShinkiEMU adapters"

[dependencies]
anyhow = "1"
cc = "1"
object = { version = "0.37.3", default-features = false, features = ["read"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
