[workspace]
resolver = "3"
members = [
    "xtask",
    "Source/Tools/shinki-emu-build",
    "Source/SDK/shinki-emu-sdk",
    "Source/FamilyApi/shinki-emu-abi",
    "Source/Cores/*",
    "Source/Native/shinki-emu-ffmpeg",
    "Source/Native/roukaku-libass",
    "Source/Families/shinki-emu-adv32",
    "Source/Families/shinki-emu-cmvs",
    "Source/Families/shinki-emu-lucifen",
    "Source/Families/shinki-emu-lucifen-formats",
    "Source/Families/shinki-emu-musica",
    "Source/Families/shinki-emu-musica-keys",
    "Source/Families/shinki-emu-musica-format",
    "Source/Examples/shinki-emu-tilefix",
    "Source/Programs/shinki-emu-musica-cli",
    "Source/Programs/shinki-emu-headless",
    "Source/Tools/shinki-emu-patch",
    "Source/Manager/shinki-emu-manager-core",
    "Source/Providers/shinki-emu-translation",
    "Source/Providers/shinki-emu-metadata",
    "Source/Providers/shinki-emu-steam",
    "Source/Providers/shinki-emu-dmm",
    "Source/Providers/shinki-emu-store",
    "Source/Providers/shinki-emu-dlsite",
    "Source/Manager/shinki-emu-manager-ui-slint",
    "Source/Manager/shinki-emu-manager",
]
exclude = [
    "ThirdParty/cpal",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.23.1"
blowfish = "=0.10.0"
clap = { version = "4.6.7", features = ["derive"] }
fontdb = "=0.24.0"
cpal = "=0.18.2"
crossbeam-channel = "0.5.17"
kira = { version = "=0.12.5", default-features = false }
directories = "6.0.0"
dunce = "1.0.5"
flate2 = "=1.1.10"
encoding_rs = "0.8.42"
ffmpeg-next = "9.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
gilrs = { version = "0.11.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
jni = "0.22.4"
object = { version = "0.40.0", default-features = false, features = ["read"] }
libloading = "0.9.0"
lru = "=0.19.0"
libc = "0.2.191"
mlua = { version = "0.12.2", features = ["luau", "vendored", "serialize"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false }
postcard = { version = "1.1.3", features = ["alloc"] }
parking_lot = "0.13.0"
pollster = "1.0.1"
rc4 = "=0.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
bangumi-api = "0.1.2"
rcgen = "0.14.10"
rfd = { version = "0.17.2", default-features = false, features = ["wayland", "xdg-portal"] }
rubato = { version = "5.0.1", default-features = false, features = ["fft_resampler"] }
rustfft = "6.4.1"
schemars = { version = "1.2.3", features = ["uuid1"] }
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = { version = "=1.18.1", default-features = false }
slint-build = "=1.18.1"
symphonia = { version = "0.6.1", features = ["all"] }
tempfile = "3.27.0"
ctrlc = "3.5.2"
thiserror = "2.0.21"
windows-sys = "0.61.2"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
zeroize = { version = "1.9.1", features = ["derive"] }
time = { version = "0.3.55", features = ["formatting"] }
uuid = { version = "1.29.0", features = ["serde"] }
url = "2.5.8"
unicode-normalization = "0.1.26"
strsim = "0.11.1"
vn = "0.11.2"
windows = { version = "0.62.2", default-features = false }
winit = { version = "0.30.13", default-features = false }
keyring = "=4.2.0"
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["protected"] }
wgpu = { version = "30.0.1", features = ["static-dxc"] }
anyhow = "1.0.104"
oboe = "0.6.1"
roukaku-byte-source = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-core = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-headless-protocol = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-media = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-media-core = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-observability = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-platform = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-platform-common = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-subtitle = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }
roukaku-text = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "794891a13f4daae32046871cba5fa4ca3e3b87db" }

shinki-emu-rfvp = { git = "https://github.com/Project-Shinkirou/rfvp", rev = "9896f61c25227a36f8ee205b46b35b9d25d96420", default-features = false }
shinki-emu-siglus_rs = { git = "https://github.com/Project-Shinkirou/siglus_rs", rev = "575075a678a17d4e21ac81c24adbef124ab2027e", default-features = false }
shinki-emu-art3m1s-core = { git = "https://github.com/Project-Shinkirou/art3m1s-core", rev = "a761f0926ee3c7280d696c8c36763500cd319194", default-features = false }
shinki-emu-sena-rs = { git = "https://github.com/Project-Shinkirou/sena-rs", rev = "c4c4114ae200139d477b7f3180440b3895dc04d9", default-features = false }
shinki-emu-kirikiroid2-web = { git = "https://github.com/Project-Shinkirou/kirikiroid2-web", rev = "8e0a42a5a247b18c38f886e677545277139764ed", default-features = false }
shinki-kirikiroid2-web-android-host = { git = "https://github.com/Project-Shinkirou/kirikiroid2-web", rev = "8e0a42a5a247b18c38f886e677545277139764ed" }
shinki-emu-ethornell-rs = { git = "https://github.com/Project-Shinkirou/ethornell-rs", rev = "ee0898860ada086abaca1cac82a05430bb601ab7", default-features = false }
shinki-emu-ReMinori = { git = "https://github.com/Project-Shinkirou/ReMinori", rev = "f0508bd37c8e74dfb38880d33348c0b133facd11", default-features = false }
shinki-emu-impacto = { git = "https://github.com/Project-Shinkirou/impacto", rev = "81e4b1f3e6baa1547284e6a75ea9e45c6aa637f7", default-features = false }
shinki-emu-renpy = { git = "https://github.com/Project-Shinkirou/renpy", rev = "0072512dc0181fa737784f309fbf228b605617dd", default-features = false }
shinki-emu-cmvs-rs = { git = "https://github.com/Project-Shinkirou/cmvs-rs", rev = "ac721405102574f3298ab5e64c8b20928dcc81d5", default-features = false }
shinki-emu-krkr2 = { git = "https://github.com/Project-Shinkirou/krkr2", rev = "c7edf3e4e4211bfefc9aef6a44798952a1f16ca0", default-features = false }
shinki-krkr2-android-host = { git = "https://github.com/Project-Shinkirou/krkr2", rev = "c7edf3e4e4211bfefc9aef6a44798952a1f16ca0" }

[patch."https://github.com/Project-Shinkirou/ShinkiEMU"]
shinki-emu-abi = { path = "Source/FamilyApi/shinki-emu-abi" }
shinki-emu-build = { path = "Source/Tools/shinki-emu-build" }
shinki-emu-sdk = { path = "Source/SDK/shinki-emu-sdk" }
shinki-emu-ffmpeg = { path = "Source/Native/shinki-emu-ffmpeg" }

[patch.crates-io]
ffmpeg-sys-next = { git = "https://github.com/Project-Shinkirou/rust-ffmpeg-sys", rev = "4d990f745d3605142240cb897063af12e20f7c2d" }
cpal = { path = "ThirdParty/cpal" }
kira = { git = "https://github.com/Project-Shinkirou/kira.git", rev = "d3b2c85160361adcd7c899bfd91c09b31cf7979c" }
mlua-sys = { git = "https://github.com/mlua-rs/mlua", rev = "ff96ed786295cae96f43ef1372bd22be0fbf7866" }

[patch."https://github.com/Project-Shinkirou/cpal.git"]
cpal = { path = "ThirdParty/cpal" }

[patch."https://github.com/Project-Shinkirou/RoukakuEngine"]
roukaku-libass = { path = "Source/Native/roukaku-libass" }

[patch."https://github.com/ruffle-rs/rust-flash-lso"]
flash-lso = { git = "https://github.com/Project-Shinkirou/rust-flash-lso", rev = "5573168345ef2d92d01ee0766bab29acf89584c0" }
