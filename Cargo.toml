[workspace]
resolver = "3"
members = [
    "xtask",
    "Source/Tools/shinki-emu-build",
    "Source/SDK/shinki-emu-sdk",
    "Source/FamilyApi/shinki-emu-abi",
    "Source/Families/shinki-emu-cmvs",
    "Source/Families/shinki-emu-musica",
    "Source/Families/shinki-emu-musica-keys",
    "Source/Programs/shinki-emu-musica-cli",
    "Source/Tools/shinki-emu-patch",
    "Source/Manager/shinki-emu-manager-core",
    "Source/Providers/shinki-emu-translation",
    "Source/Providers/shinki-emu-metadata",
    "Source/Providers/shinki-emu-steam",
    "Source/Manager/shinki-emu-manager-ui-slint",
    "Source/Manager/shinki-emu-manager",
]
exclude = [
    "ThirdParty/art3m1s-core",
    "ThirdParty/rfvp",
    "ThirdParty/siglus_rs",
    "ThirdParty/sena-rs",
    "ThirdParty/ethornell-rs",
    "ThirdParty/cpal",
    "ThirdParty/ReMinori",
    "ThirdParty/impacto",
    "ThirdParty/renpy",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
aes-gcm-siv = "0.12.1"
accesskit = "=0.25.1"
accesskit_android = { version = "=0.9.0", features = ["embedded-dex"] }
accesskit_winit = { version = "=0.34.1", default-features = false, features = ["rwh_06"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio"] }
base64 = "0.23.1"
binrw = "0.15.2"
blowfish = "=0.10.0"
blake3 = "1.8.7"
camino = { version = "1.2.6", features = ["serde1"] }
clap = { version = "4.6.7", features = ["derive"] }
configparser = "3.3.0"
cosmic-text = "=0.19.0"
fontdb = "=0.24.0"
cpal = "=0.18.2"
crossbeam-channel = "0.5.17"
kira = { version = "=0.12.5", default-features = false }
directories = "6.0.0"
dunce = "1.0.5"
flate2 = "=1.1.10"
fuser = "=0.18.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast"] }
encoding_rs = "0.8.42"
filetime = "0.2.29"
ffmpeg-next = "9.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
hound = "3.5.1"
evdev = "=0.13.2"
gilrs = { version = "0.11.2", default-features = false }
gstreamer = "=0.25.4"
gstreamer-app = "=0.25.2"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
] }
indexmap = { version = "2.14.2", features = ["serde"] }
js-sys = "0.3.106"
jni = "0.22.4"
android-activity = { version = "0.6.1", default-features = false }
ndk = "0.9.0"
object = { version = "0.40.0", default-features = false, features = ["read"] }
libloading = "0.9.0"
lru = "=0.19.0"
libc = "0.2.191"
logos = "0.16.1"
mlua = { version = "0.12.2", features = ["luau", "vendored", "serialize"] }
luaur-rt = { version = "=0.1.8", default-features = false, features = ["serde"] }
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
miette = { version = "7.6.0", features = ["fancy"] }
naga = { version = "30.0.1", features = ["spv-in", "wgsl-out"] }
postcard = { version = "1.1.3", features = ["alloc"] }
parking_lot = "0.13.0"
proptest = "1.12.0"
pollster = "1.0.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rc4 = "=0.2.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
bangumi-api = "0.1.2"
rcgen = "0.14.10"
rfd = { version = "0.17.2", default-features = false, features = ["wayland", "xdg-portal"] }
rtrb = "0.4.0"
rubato = { version = "5.0.1", default-features = false, features = [
    "fft_resampler",
] }
rustfft = "6.4.1"
schemars = { version = "1.2.3", features = ["uuid1"] }
rowan = "0.17.0"
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
smallvec = "1.16.4"
slint = { version = "=1.18.1", default-features = false }
slint-build = "=1.18.1"
symphonia = { version = "0.6.1", features = ["all"] }
syn = { version = "3.0.9", features = ["full"] }
tempfile = "3.27.0"
ctrlc = "3.5.2"
text-size = "1.1.1"
thiserror = "2.0.21"
wait-timeout = "0.2.1"
walkdir = "2.5.0"
windows-sys = "0.61.2"
winresource = "0.1.34"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
zeroize = { version = "1.9.1", features = ["derive"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
] }
tungstenite = "0.30.0"
unicode-segmentation = "1.13.3"
chumsky = "0.13.0"
insta = "1.49.0"
file-rotate = "0.8.0"
fast-srgb8 = "1.0.0"
time = { version = "0.3.55", features = ["formatting"] }
uuid = { version = "1.29.0", features = ["serde"] }
url = "2.5.8"
unicode-normalization = "0.1.26"
strsim = "0.11.1"
vn = "0.11.2"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
wasm-bindgen-test = "0.3.79"
wasmparser = "0.262.0"
web-sys = "0.3.106"
windows = { version = "0.62.2", default-features = false }
winit = { version = "0.30.13", default-features = false }
keyring = "=4.2.0"
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["protected"] }
wgpu = { version = "30.0.1", features = ["static-dxc"] }
rayon = "1.12.0"
yakui-core = { git = "https://github.com/SecondHalfGames/yakui", rev = "4b87f09ce18c36975de022507123eb360153728d", default-features = false }
yakui-widgets = { git = "https://github.com/SecondHalfGames/yakui", rev = "4b87f09ce18c36975de022507123eb360153728d", default-features = false }
zstd = "0.14.3"
anyhow = "1.0.104"
ndk-sys = "0.6.0"
oboe = "0.6.1"
roukaku-byte-source = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }
roukaku-core = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }
roukaku-media = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }
roukaku-media-core = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }
roukaku-observability = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }
roukaku-platform = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }
roukaku-platform-common = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }
roukaku-subtitle = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }
roukaku-text = { git = "https://github.com/Project-Shinkirou/RoukakuEngine", rev = "8392cf161800f7684af7704eb95f7a5526d2015d" }

# Android static cores use the workspace ABI and native build helper rather than
# a second copy of the same packages from this repository's Git URL.
[patch."https://github.com/Project-Shinkirou/ShinkiEMU"]
shinki-emu-abi = { path = "Source/FamilyApi/shinki-emu-abi" }
shinki-emu-build = { path = "Source/Tools/shinki-emu-build" }

[patch.crates-io]
cpal = { path = "ThirdParty/cpal" }
# Published 0.13.0 rejects Luau 744's bytecode; upstream raises the supported maximum to 14.
mlua-sys = { git = "https://github.com/mlua-rs/mlua", rev = "ff96ed786295cae96f43ef1372bd22be0fbf7866" }

[patch."https://github.com/Project-Shinkirou/cpal.git"]
cpal = { path = "ThirdParty/cpal" }

[patch."https://github.com/ruffle-rs/rust-flash-lso"]
flash-lso = { git = "https://github.com/Project-Shinkirou/rust-flash-lso", rev = "5573168345ef2d92d01ee0766bab29acf89584c0" }
