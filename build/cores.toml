[[cores]]
id = "rfvp"
display_name = "RFVP"
family_name = "FVP"
license = "MPL-2.0"
manifest = "ThirdParty/rfvp/crates/shinki-emu-rfvp/Cargo.toml"
package = "shinki-emu-rfvp"
features = ["dynamic-plugin-export"]
dependencies = ["subtitle", "gstreamer"]
artifact_kind = "rust-cdylib"
resources = []
licenses = ["ThirdParty/rfvp/LICENSE", "ThirdParty/rfvp/crates/shinki-emu-rfvp/THIRD_PARTY_NOTICES.md", "ThirdParty/rfvp/crates/shinki-emu-rfvp/MODIFICATIONS.md"]
supported_targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
static_manager_targets = ["aarch64-linux-android", "x86_64-linux-android", "aarch64-apple-ios", "aarch64-apple-ios-sim", "x86_64-apple-ios"]
publish_blocked = ""
[cores.source]
repo = "https://github.com/Project-Shinkirou/rfvp"
branch = "shinki-android-isolation"
rev = "9a5c20026e3638ef5714c2ad7062634648c8dfcf"
upstream = "https://github.com/xmoezzz/rfvp"
[[cores.blocked]]
target = "aarch64-unknown-linux-ohos"
reason = "GStreamer is not the only OHOS blocker: RFVP's kira audio runs on cpal, which selects ALSA (alsa-sys) on aarch64-unknown-linux-ohos and has no OHAudio backend, and its mp4 movie path uses video-sys, which selects GStreamer on target_os = \"linux\"."
[[cores.blocked]]
target = "aarch64-linux-android"
reason = "Only the existing rfvp static-in-Manager integration is adapted; no standalone dynamic-core Android packaging path."
[[cores.blocked]]
target = "x86_64-linux-android"
reason = "Only the existing rfvp static-in-Manager integration is adapted; no standalone dynamic-core Android packaging path."
