# Packaging host tool: cargo install cargo-about --version 0.9.3 --locked
# Keep the Slint royalty-free terms ahead of GPL alternatives.
accepted = [
    "MIT", "Apache-2.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
    "Zlib", "BSL-1.0", "CC0-1.0", "Unlicense", "WTFPL", "MIT-0", "Unicode-3.0",
    "Unicode-DFS-2016", "NCSA", "OpenSSL", "OpenSSL-standalone",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0", "MPL-2.0", "OFL-1.1", "OFL-1.1-RFN", "Ubuntu-font-1.0",
    "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-KiriKiri2", "LicenseRef-UFL-1.0",
    "LGPL-2.0-only", "LGPL-2.0-or-later", "LGPL-2.1-only", "LGPL-2.1-or-later",
    "LGPL-3.0-only", "LGPL-3.0-or-later", "GPL-2.0-only", "GPL-2.0-or-later",
    "GPL-3.0-only", "GPL-3.0-or-later", "AGPL-3.0-only", "AGPL-3.0-or-later",
]
# Build dependencies can supply linked code (for example luau0-src).
ignore-dev-dependencies = true
workarounds = ["ring", "rustls", "unicode-ident"]
